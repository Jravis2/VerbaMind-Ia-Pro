<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Primary 'V' Vibrant Gradient -->
    <linearGradient id="vGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="vGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="55%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Neural Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(99, 102, 241, 0.25)" stroke-width="4" />

  <!-- Ambient Glow in Background -->
  <circle cx="256" cy="270" r="140" fill="#6366f1" opacity="0.28" filter="url(#softGlow)" />
  <circle cx="160" cy="180" r="90" fill="#38bdf8" opacity="0.22" filter="url(#softGlow)" />
  <circle cx="350" cy="180" r="90" fill="#ec4899" opacity="0.22" filter="url(#softGlow)" />

  <!-- Neural Network Constellation Lines -->
  <g opacity="0.45" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="6,6">
    <line x1="120" y1="140" x2="256" y2="390" />
    <line x1="392" y1="140" x2="256" y2="390" />
    <line x1="120" y1="140" x2="256" y2="180" />
    <line x1="392" y1="140" x2="256" y2="180" />
    <line x1="256" y1="180" x2="256" y2="390" />
  </g>

  <!-- Main Stylized 'V' (Left wing - Cyber Cyan to Indigo) -->
  <path d="M 105 130 C 120 130 145 150 165 200 L 235 375 C 243 395 250 405 256 405 C 256 405 235 345 205 270 L 160 160 C 145 125 120 125 105 130 Z"
        fill="url(#vGradLeft)" filter="url(#glow)" />

  <!-- Main Stylized 'V' (Right wing - Neon Fuchsia to Violet) -->
  <path d="M 407 130 C 392 130 367 150 347 200 L 277 375 C 269 395 262 405 256 405 C 256 405 277 345 307 270 L 352 160 C 367 125 392 125 407 130 Z"
        fill="url(#vGradRight)" filter="url(#glow)" />

  <!-- Central Synaptic Energy Core (Mind / Language Spark) -->
  <g filter="url(#glow)">
    <!-- Central Diamond Nexus -->
    <polygon points="256,150 286,185 256,220 226,185" fill="#38bdf8" />
    <polygon points="256,160 278,185 256,210 234,185" fill="#ffffff" />

    <!-- Neural Satellite Nodes -->
    <circle cx="120" cy="140" r="16" fill="#38bdf8" />
    <circle cx="120" cy="140" r="8" fill="#ffffff" />

    <circle cx="392" cy="140" r="16" fill="#ec4899" />
    <circle cx="392" cy="140" r="8" fill="#ffffff" />

    <!-- Apex Point Sparkle -->
    <circle cx="256" cy="405" r="14" fill="#a855f7" />
    <circle cx="256" cy="405" r="6" fill="#ffffff" />

    <!-- Secondary Thought Wave Nodes -->
    <circle cx="195" cy="275" r="8" fill="#67e8f9" />
    <circle cx="317" cy="275" r="8" fill="#f472b6" />
  </g>
</svg>
